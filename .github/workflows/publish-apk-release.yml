name: Publish Android APK Release

on:
  workflow_run:
    workflows: ["Android build"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  publish-release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download APK from successful Android build
        uses: actions/download-artifact@v4
        with:
          name: juet-student-portal-debug-apk
          path: release-assets
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          set -euo pipefail
          test -s release-assets/app-debug.apk
          TAG="v0.1.${RUN_NUMBER}"
          gh release create "${TAG}" release-assets/app-debug.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --title "JUET Student Portal ${TAG}" \
            --notes "Automated debug APK built by GitHub Actions. This is a development build; private student records are not connected. Do not enter real JUET credentials."
