name: Publish Android APK Release

on:
  workflow_run:
    workflows: ["Android build"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  publish-release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download APK from successful Android build
        uses: actions/download-artifact@v7
        with:
          name: juet-student-portal-debug-apk
          path: release-assets
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename APK asset
        run: mv release-assets/app-debug.apk release-assets/juet.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          set -euo pipefail
          test -s release-assets/juet.apk
          TAG="v1.0.${RUN_NUMBER}"
          gh release create "${TAG}" release-assets/juet.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --title "JUET APK ${TAG}" \
            --notes "JUET Student Portal APK v1. Built by GitHub Actions. This is a development build; confirm portal functionality on your device. Direct private student-data API integration is not yet complete."
